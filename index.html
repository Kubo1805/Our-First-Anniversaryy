<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="lock-screen">

        <!-- =========================================
             BACKGROUND DECORATION
        ========================================== -->

        <div class="background-glow"></div>


        <!-- =========================================
             FLOATING HEART PHOTOS
        ========================================== -->

        <div class="floating-photos">

            <!-- TEST PHOTO -->
            <div class="photo photo-1">

                <svg
                    class="heart-photo"
                    viewBox="0 0 100 100"
                    aria-label="A memory of us"
                >

                    <defs>

                        <clipPath id="heartClip1">

                            <path
                                d="
                                    M50 88
                                    C44 82 10 60 10 32
                                    C10 17 20 8 33 8
                                    C41 8 47 12 50 19
                                    C53 12 59 8 67 8
                                    C80 8 90 17 90 32
                                    C90 60 56 82 50 88
                                    Z
                                "
                            />

                        </clipPath>

                    </defs>


                    <image
                        href="images/photo1.jpg"
                        width="100"
                        height="100"
                        preserveAspectRatio="xMidYMid slice"
                        clip-path="url(#heartClip1)"
                    />

                </svg>

            </div>


            <!--
                We'll add the other photos later.
            -->

        </div>


        <!-- =========================================
             CENTRAL HEART LOCK
        ========================================== -->

        <button
            class="heart-lock"
            id="heartLock"
            aria-label="Unlock our story"
        >

            <img
                src="images/heart-lock.png"
                alt=""
            >

        </button>


        <!-- =========================================
             UNLOCK TEXT
        ========================================== -->

        <p class="unlock-text">
            tap to unlock ♡
        </p>


        <!-- =========================================
             RADIATING HEARTS
        ========================================== -->

        <div
            class="heart-rays"
            id="heartRays"
            aria-hidden="true"
        ></div>


    </main>


    <script src="script.js"></script>

</body>

</html>
