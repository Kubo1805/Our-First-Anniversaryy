<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="lock-screen">

        <!-- Floating photos -->
        <div class="floating-photos">

            <div class="photo photo-1">
    <svg viewBox="0 0 100 100" class="heart-photo" aria-label="A memory of us">
        <defs>
            <clipPath id="heartClip">
                <path d="
                    M50 88
                    C45 82 10 60 10 32
                    C10 17 20 8 33 8
                    C41 8 47 12 50 19
                    C53 12 59 8 67 8
                    C80 8 90 17 90 32
                    C90 60 55 82 50 88
                    Z
                "/>
            </clipPath>
        </defs>

        <image
            href="images/photo1.jpg"
            width="100"
            height="100"
            preserveAspectRatio="xMidYMid slice"
            clip-path="url(#heartClip)"
        />
    </svg>
</div>

        </div>


        <!-- Center lock -->
       <button class="heart-lock" id="heartLock" aria-label="Unlock our story">

    <svg
        class="lock-svg"
        viewBox="0 0 300 320"
        xmlns="http://www.w3.org/2000/svg"
    >

        <defs>

            <!-- Main pink body -->
            <linearGradient
                id="lockPink"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
            >
                <stop offset="0%" stop-color="#ffafd0"/>
                <stop offset="45%" stop-color="#f784ad"/>
                <stop offset="100%" stop-color="#e95c91"/>
            </linearGradient>

            <!-- Shackle gradient -->
            <linearGradient
                id="shacklePink"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
            >
                <stop offset="0%" stop-color="#f4b0cd"/>
                <stop offset="100%" stop-color="#d66f9e"/>
            </linearGradient>

            <!-- Small shadow -->
            <filter id="lockShadow">
                <feDropShadow
                    dx="0"
                    dy="12"
                    stdDeviation="9"
                    flood-color="#9b4670"
                    flood-opacity="0.22"
                />
            </filter>

        </defs>


        <!-- SHACKLE -->

       <!-- SHACKLE -->

<path
    d="M91 128
       V81
       C91 35 117 17 150 17
       C183 17 209 35 209 81
       V128"

    stroke="#d979a4"
    stroke-width="28"
    stroke-linecap="round"
/>

<!-- Soft glossy highlight -->

<path
    d="M96 78
       C96 48 116 29 145 26"
    fill="none"
    stroke="#f8c2d9"

        M190 40

    fill="#fff4fa"

/>

        <!-- Shackle highlight -->

        <path
            d="M96 79
               C96 43 118 27 150 27"
            fill="none"
            stroke="#ffd9e9"
            stroke-width="7"
            stroke-linecap="round"
            opacity="0.7"
        />


        <!-- HEART BODY -->

       <path
    d="
        M150 292

        C30 82 62 54 102 54

        C158 66 174 54 198 54

        C238 54 270 82 270 128

/>

<path
    d="
        M150 278
        C132 265 45 209 45 130
    "
    fill="none"

    d="

<circle
    cx="224"

        />


        <!-- Keyhole -->

<circle
    cx="150"

        />

        <circle
            cx="197"

            r="5"
            fill="#fff3f8"
            opacity="0.65"
        />

    </svg>

</button>


        <!-- Instruction -->
        <p class="unlock-text">
            tap to unlock ♡
        </p>


        <!-- Heart particles -->
        <div class="heart-rays" id="heartRays"></div>

    </main>


    <script src="script.js"></script>

</body>
</html>
