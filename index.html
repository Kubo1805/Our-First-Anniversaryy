<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="lock-screen">

        <!-- Floating photos -->
        <div class="floating-photos">

            <div class="photo photo-1">
                <img src="images/photo1.jpg" alt="A memory of us">
            </div>

            <div class="photo photo-2">
                <img src="images/photo2.jpg" alt="A memory of us">
            </div>

            <div class="photo photo-3">
                <img src="images/photo3.jpg" alt="A memory of us">
            </div>

            <div class="photo photo-4">
                <img src="images/photo4.jpg" alt="A memory of us">
            </div>

            <div class="photo photo-5">
                <img src="images/photo5.jpg" alt="A memory of us">
            </div>

            <div class="photo photo-6">
                <img src="images/photo6.jpg" alt="A memory of us">
            </div>

        </div>


        <!-- Center lock -->
        <button class="heart-lock" id="heartLock" aria-label="Unlock our story">

            <div class="lock-shackle"></div>

            <div class="lock-heart">

                <div class="keyhole"></div>

            </div>

        </button>


        <!-- Instruction -->
        <p class="unlock-text">
            tap to unlock ♡
        </p>


        <!-- Heart particles -->
        <div class="heart-rays" id="heartRays"></div>

    </main>


    <script src="script.js"></script>

</body>
</html>
