<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="lock-screen">

        <!-- Floating photos -->
        <div class="floating-photos">

            <div class="photo photo-1">
    <svg viewBox="0 0 100 100" class="heart-photo" aria-label="A memory of us">
        <defs>
            <clipPath id="heartClip">
                <path d="
                    M50 88
                    C45 82 10 60 10 32
                    C10 17 20 8 33 8
                    C41 8 47 12 50 19
                    C53 12 59 8 67 8
                    C80 8 90 17 90 32
                    C90 60 55 82 50 88
                    Z
                "/>
            </clipPath>
        </defs>

        <image
            href="images/photo1.jpg"
            width="100"
            height="100"
            preserveAspectRatio="xMidYMid slice"
            clip-path="url(#heartClip)"
        />
    </svg>
</div>

        </div>


        <!-- Center lock -->
        <button class="heart-lock" id="heartLock" aria-label="Unlock our story">

            <div class="lock-shackle"></div>

            <div class="lock-heart">

                <div class="keyhole"></div>

            </div>

        </button>


        <!-- Instruction -->
        <p class="unlock-text">
            tap to unlock ♡
        </p>


        <!-- Heart particles -->
        <div class="heart-rays" id="heartRays"></div>

    </main>


    <script src="script.js"></script>

</body>
</html>
