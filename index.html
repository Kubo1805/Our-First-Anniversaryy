<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="lock-screen">

        <!-- =========================================
             BACKGROUND DECORATION
        ========================================== -->

        <div class="background-glow"></div>


        <!-- =========================================
             FLOATING HEART PHOTOS
        ========================================== -->
<div
    class="floating-photos"
    id="floatingPhotos"
    aria-hidden="true"
></div>
            <!--
                We'll add the other photos later.
            -->

        </div>




<!-- =========================================
     ANIMATED HEART LOCK
========================================= -->

<button
    class="heart-lock"
    id="heartLock"
    aria-label="Unlock our story"
>

    <!-- Shackle -->
    <img
        class="lock-shackle"
        src="images/SHACKLE.png"
        alt=""
        aria-hidden="true"
    >

    <!-- Heart body -->
    <img
        class="lock-body"
        src="images/PADLOCK BODY.png"
        alt=""
        aria-hidden="true"
    >

</button>


        <!-- =========================================
             UNLOCK TEXT
        ========================================== -->

        <p class="unlock-text">
            tap to unlock ♡
        </p>


        <!-- =========================================
             RADIATING HEARTS
        ========================================== -->

        <div
            class="heart-rays"
            id="heartRays"
            aria-hidden="true"
        ></div>


    </main>


    <script src="script.js"></script>

</body>

</html>
