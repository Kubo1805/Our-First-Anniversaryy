<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="lock-screen">

        <!-- =========================================
             BACKGROUND DECORATION
        ========================================== -->

        <div class="background-glow"></div>


        <!-- =========================================
     DREAMY SKY BACKGROUND
========================================= -->

<div class="dreamy-sky" aria-hidden="true">

<svg
    class="moon"
    viewBox="0 0 220 220"
    aria-hidden="true"
>
    <defs>
        <radialGradient id="moonGradient" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#fff5fa"/>
            <stop offset="70%" stop-color="#ffd9e8"/>
            <stop offset="100%" stop-color="#efb7d0"/>
        </radialGradient>
    </defs>

    <path
        d="
            M150 18
            C88 18 38 67 38 126
            C38 184 86 202 126 202
            C100 182 88 154 88 120
            C88 67 128 28 178 27
            C169 21 160 18 150 18
            Z
        "
        fill="url(#moonGradient)"
    />

</svg>

    <!-- Clouds -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>

    <!-- Tiny stars -->
    <div class="star star-1">✦</div>
    <div class="star star-2">✦</div>
    <div class="star star-3">✦</div>
    <div class="star star-4">·</div>
    <div class="star star-5">·</div>

</div>


        <!-- =========================================
             FLOATING HEART PHOTOS
        ========================================== -->
<div
    class="floating-photos"
    id="floatingPhotos"
    aria-hidden="true"
></div>
            <!--
                We'll add the other photos later.
            -->

        </div>




<!-- =========================================
     ANIMATED HEART LOCK
========================================= -->

<button
    class="heart-lock"
    id="heartLock"
    aria-label="Unlock our story"
>

    <!-- Shackle -->
    <img
        class="lock-shackle"
        src="images/SHACKLE.png"
        alt=""
        aria-hidden="true"
    >

    <!-- Heart body -->
    <img
        class="lock-body"
        src="images/PADLOCK BODY.png"
        alt=""
        aria-hidden="true"
    >

</button>


        <!-- =========================================
             UNLOCK TEXT
        ========================================== -->

        <p class="unlock-text">
            tap to unlock ♡
        </p>


        <!-- =========================================
             RADIATING HEARTS
        ========================================== -->

        <div
            class="heart-rays"
            id="heartRays"
            aria-hidden="true"
        ></div>


    </main>


    <script src="script.js"></script>

</body>

</html>
